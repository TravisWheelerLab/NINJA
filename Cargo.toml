[package]
name = "ninja-phylo"
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "NINJA: large-scale neighbor-joining phylogeny inference (installs the `ninja` binary)"
repository = "https://github.com/TravisWheelerLab/ninja"
readme = "README.md"
keywords = ["phylogenetics", "neighbor-joining", "bioinformatics", "tree"]
categories = ["science", "command-line-utilities"]
default-run = "ninja"
# Keep the published package small: tests need the fixtures and reference
# outputs, which live in the repository.
exclude = ["/tests", "/scripts", "/.github", "/rustfmt.toml", "/TODO.md"]

[lib]
name = "ninja"
path = "src/lib.rs"

[[bin]]
name = "ninja"
path = "src/bin/ninja.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
rayon = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.bench]
inherits = "release"
